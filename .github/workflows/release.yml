name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      - run: npx --yes @vscode/vsce package
      - run: gh release create "$GITHUB_REF_NAME" ./*.vsix --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
